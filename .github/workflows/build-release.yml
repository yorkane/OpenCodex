name: Build deb and draft release

on:
  push:

# 默认只读取仓库内容，创建 Release 的写权限仅授予发布任务。
permissions:
  contents: read

jobs:
  metadata:
    name: Detect release version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      version: ${{ steps.version.outputs.version }}
      should_build_artifacts: ${{ steps.changes.outputs.should_build_artifacts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 需要比较 push 前后的提交，完整历史可以覆盖多提交 push 的变更范围。
          fetch-depth: 0

      - name: Detect version bump commit
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 仅匹配 HEAD commit 的标题，避免普通提交误触发发布流程。
          commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
          commit_subject="${commit_subject%$'\r'}"

          # 发布 Release 会推送 tag，tag push 也会命中 on: push；
          # 它指向刚构建过的同一个提交，重跑只会重复构建，因此标记为 tag 直接跳过。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "is_tag=false" >> "$GITHUB_OUTPUT"

          if [[ "$commit_subject" =~ ^chore:\ bump\ version\ to\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            package_version="$(node --print "require('./package.json').version")"

            # 提交中的版本必须与安装包版本一致，防止创建错误的 Tag 和 Release。
            if [[ "$version" != "$package_version" ]]; then
              echo "Version mismatch: commit=$version, package.json=$package_version" >&2
              exit 1
            fi

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether artifact build is needed
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
          IS_TAG: ${{ steps.version.outputs.is_tag }}
        run: |
          # tag push 不产出任何东西，直接跳过，避免同一提交被构建两次。
          if [[ "$IS_TAG" == "true" ]]; then
            echo "should_build_artifacts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 发布提交必须继续构建安装包，保证 release 任务始终有完整产物可用。
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "should_build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 新分支或新 tag 没有可比较的 before 提交时保守地执行构建。
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "should_build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 比较失败时保守执行构建，避免因为 Git 历史异常而错误跳过安装包。
          if ! changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"; then
            echo "Unable to compare push commits; building artifacts" >&2
            echo "should_build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_build_artifacts=false
          while IFS= read -r changed_file; do
            [[ -n "$changed_file" ]] || continue

            # 只有根目录 README.md 或 docs/ 下的文档变更时跳过安装包构建。
            if [[ "$changed_file" != "README.md" && "$changed_file" != docs/* ]]; then
              should_build_artifacts=true
              break
            fi
          done <<< "$changed_files"

          echo "should_build_artifacts=$should_build_artifacts" >> "$GITHUB_OUTPUT"

  build-deb:
    name: Build Debian package
    needs: metadata
    # 目标机是 Debian/Ubuntu 22.04，用同版本 runner 构建，保证 dpkg 与 glibc 对齐。
    runs-on: ubuntu-22.04
    if: needs.metadata.outputs.is_release == 'true' || needs.metadata.outputs.should_build_artifacts == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the deb
        run: |
          # 包只从 gateway/dist 取运行时，因此必须先把构建产物做出来。
          pnpm run build
          bash packaging/linux/build-deb.sh

      - name: Verify the deb
        shell: bash
        run: |
          shopt -s nullglob
          deb_files=(release/*.deb)
          if (( ${#deb_files[@]} != 1 )); then
            echo "Expected exactly one deb, found ${#deb_files[@]}" >&2
            exit 1
          fi

          deb="${deb_files[0]}"
          echo "Package: $deb"
          dpkg-deb -f "$deb" Package Version Architecture Depends

          # 解包后确认关键路径都在：启动器、两个 systemd 单元、构建产物。
          version="$(dpkg-deb -f "$deb" Version)"
          tmp="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmp"
          for required in \
            "usr/bin/opencodex-gateway" \
            "lib/systemd/system/opencodex-gateway.service" \
            "lib/systemd/system/opencodex-xvfb.service" \
            "etc/opencodex/gateway.env" \
            "etc/opencodex/config.yaml" \
            "opt/opencodex/gateway/dist/modification/catalog.js" \
            "opt/opencodex/run-gateway.sh"; do
            if [[ ! -e "$tmp/$required" ]]; then
              echo "Missing from package: $required" >&2
              exit 1
            fi
          done
          if [[ "$(cat "$tmp/opt/opencodex/VERSION")" != "$version" ]]; then
            echo "Bundled VERSION does not match package version" >&2
            exit 1
          fi
          echo "deb layout verified for $version"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          # 外层 Artifact 名称携带完整提交哈希，内部 deb 文件名保持不变。
          name: opencodex-deb-${{ github.sha }}
          path: release/*.deb
          if-no-files-found: error

  release:
    name: Create draft release
    if: needs.metadata.outputs.is_release == 'true'
    needs:
      - metadata
      - build-deb
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Download the deb
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          shopt -s nullglob
          deb_files=(release-assets/*.deb)

          # 本分支只产出 Debian 包：macOS/Windows 安装包已移除。
          if (( ${#deb_files[@]} != 1 )); then
            echo "Unexpected assets: ${#deb_files[@]} deb" >&2
            exit 1
          fi

      - name: Create or update draft release
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.deb)

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            # 重跑流水线时仅更新已有草稿，避免覆盖已经正式发布的 Release。
            is_draft="$(gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_VERSION already exists and is not a draft" >&2
              exit 1
            fi

            gh release edit "$RELEASE_VERSION" --title "v$RELEASE_VERSION" --draft=true
            gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_VERSION" "${assets[@]}" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "v$RELEASE_VERSION" \
              --notes ""
          fi
